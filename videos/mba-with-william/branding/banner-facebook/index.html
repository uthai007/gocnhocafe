<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1640, height=624" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1640px; height: 624px; overflow: hidden; background: #070a14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; color: #fff; }
      #bg { position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 45% 70% at 32.3% 48.1%, rgba(255, 236, 196, 0.22) 0%, rgba(255, 236, 196, 0) 60%),
          radial-gradient(ellipse 80% 90% at 50% 45%, #1d3060 0%, #0d1832 55%, #070a14 100%); }
      .curtain { position: absolute; top: 0; bottom: 0; width: 115px;
        background: repeating-linear-gradient(90deg, #4a0f1c 0 18px, #6b1626 18px 31px, #3a0b16 31px 43px); opacity: 0.9; }
      #cl { left: 0; } #cr { right: 0; }
      #floor { position: absolute; left: 0; right: 0; bottom: 0; height: 75px; background: linear-gradient(180deg, #3a2a20 0%, #120c09 100%); border-top: 4px solid #6d5240; }
      #beam { position: absolute; left: 176px; top: 0; width: 648px; height: 624px;
        background: linear-gradient(180deg, rgba(255, 240, 210, 0.13) 0%, rgba(255, 240, 210, 0.02) 100%);
        clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); }
      #dots { position: absolute; inset: 0;
        background-image: radial-gradient(rgba(159, 183, 240, 0.10) 1.5px, transparent 1.5px);
        background-size: 23px 23px; }
      #ring { position: absolute; left: 320px; top: 120px; width: 360px; height: 360px; border-radius: 50%;
        border: 5px solid #f2c14e; box-shadow: 0 0 22px rgba(242, 193, 78, 0.4); }
      #clip { position: absolute; left: 325px; top: 125px; width: 350px; height: 350px; border-radius: 50%; overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #2a4378 0%, #12204a 60%, #0b142c 100%); }
      #pw { position: absolute; left: 37px; top: 18px; width: 282px; height: 346px; overflow: visible;
        filter: drop-shadow(0 0 7px rgba(140, 175, 255, 0.45)); }
      #text { position: absolute; left: 715px; top: 150px; width: 700px; }
      #pill { display: inline-block; background: #f2c14e; color: #10152a; font-weight: 800; font-size: 28px; letter-spacing: 0.12em; padding: 7px 18px; border-radius: 8px; }
      #title { margin-top: 11px; font-weight: 800; font-size: 74px; line-height: 1.02; letter-spacing: -0.01em; }
      #title span { color: #f2c14e; }
      #tag { margin-top: 13px; font-weight: 500; font-size: 24px; color: #c9d6f5; }
      #chips { margin-top: 18px; display: flex; gap: 11px; flex-wrap: wrap; }
      .chip { display: block; border: 1.6px solid rgba(242, 193, 78, 0.6); color: #ffffff; font-weight: 600; font-size: 20px; padding: 7px 15px; border-radius: 25px; background: rgba(8, 12, 24, 0.55); }
    </style>
  </head>
  <body>

            </g>
          </g>
        </svg></div>
      <div id="ring"></div>
      <div id="text">
        <div id="pill">MBA ENGLISH</div>
        <div id="title">with <span>William</span></div>
        <div id="tag">Learn one MBA concept in six English sentences.</div>
        <div id="chips"><span class="chip">6 sentences</span><span class="chip">1 MBA topic</span><span class="chip">New lesson daily</span></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#pill", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
