<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #070a14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; }
      #bg { position: absolute; inset: 0;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 236, 196, 0.30) 0%, rgba(255, 236, 196, 0) 38%),
          radial-gradient(circle at 50% 40%, #22386a 0%, #0f1b38 55%, #070a14 100%); }
      #ring { position: absolute; left: 30px; top: 30px; width: 1020px; height: 1020px; border-radius: 50%;
        border: 14px solid #f2c14e; box-shadow: 0 0 60px rgba(242, 193, 78, 0.35), inset 0 0 40px rgba(242, 193, 78, 0.18); }
      #clip { position: absolute; left: 44px; top: 44px; width: 992px; height: 992px; border-radius: 50%; overflow: hidden; }
      #pw { position: absolute; left: 96px; top: 96px; width: 800px; height: 980px; overflow: visible; filter: drop-shadow(0 0 22px rgba(140, 175, 255, 0.45)); }
      #tag { position: absolute; left: 0; right: 0; bottom: 92px; display: flex; justify-content: center; }
      #tag span { display: block; background: #f2c14e; color: #10152a; font-weight: 800; font-size: 64px;
        letter-spacing: 0.08em; padding: 14px 40px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1080">
      <div id="bg"></div>
      <div id="clip"><svg id="pw" viewBox="95 40 310 380" xmlns="http://www.w3.org/2000/svg">

            <rect x="232" y="210" width="36" height="48" rx="10" fill="#d9a17f" />

            <!-- left arm (viewer's right): holds the clicker -->

              <path d="M318 278 Q350 290 352 360 L346 452 L318 452 L320 360 Z" fill="#1f2e4a" />
              <g>
                <path d="M320 444 L348 444 L340 532 L314 530 Z" fill="#1f2e4a" />
                <rect x="314" y="522" width="28" height="12" rx="4" fill="#f4f1ea" />
                <ellipse cx="328" cy="548" rx="17" ry="19" fill="#e8b796" />
                <rect x="320" y="540" width="16" height="34" rx="5" fill="#22262e" />
                <circle cx="328" cy="548" r="3.5" fill="#ff5b5b" />

            </g>

            <!-- right arm (viewer's left): gestures -->
            <g>

                fill="#3b2a20"
              />
              <path d="M214 92 Q240 70 290 80 Q262 74 238 86 Z" fill="#4e382b" />

              <g>
                <path d="M212 128 Q226 120 240 126" stroke="#3b2a20" stroke-width="6" stroke-linecap="round" fill="none" />
                <path d="M260 126 Q274 120 288 128" stroke="#3b2a20" stroke-width="6" stroke-linecap="round" fill="none" />
              </g>
              <!-- eyes -->
              <g>
                <ellipse cx="227" cy="147" rx="9" ry="6" fill="#f7f3ee" />
                <ellipse cx="273" cy="147" rx="9" ry="6" fill="#f7f3ee" />
                <circle cx="228" cy="147" r="6" fill="#4a6a86" />
                <circle cx="274" cy="147" r="6" fill="#4a6a86" />

              <!-- nose -->
              <path d="M250 150 Q246 172 240 176 Q248 182 258 177" stroke="#c48a68" stroke-width="3.5" fill="none" stroke-linecap="round" />
              <!-- mouth -->
              <path d="M232 192 Q250 210 268 192 Q250 200 232 192 Z" fill="#7a2f2f" /><path d="M234 193 Q250 199 266 193" stroke="#ffffff" stroke-width="3" fill="none" />
              <path d="M230 190 Q250 212 270 190" stroke="#a5604f" stroke-width="3.5" fill="none" stroke-linecap="round" />
            </g>
          </g>
        </svg></div>
      <div id="ring"></div>
      <div id="tag"><span>MBA ENGLISH</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#tag", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
